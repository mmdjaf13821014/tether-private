name: Liquid Glass iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - liquid-glass-ios26

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned iOS IPA with iOS 26 SDK
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: liquid-glass-ios26

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --quiet

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          xcodebuild -project Tether.xcodeproj -scheme Tether -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-liquid-glass \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Package unsigned IPA
        run: |
          app=$(find ios/build-liquid-glass/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$app"
          mkdir -p work/Payload dist
          cp -R "$app" work/Payload/
          (cd work && zip -qry "../dist/Tether-liquid-glass-unsigned.ipa" Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tether-liquid-glass-unsigned-IPA
          path: dist/Tether-liquid-glass-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

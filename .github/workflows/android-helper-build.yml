name: Android Helper Test Build
on:
  push:
    branches: [liquid-glass-ios26]
    paths:
      - "android/**"
      - ".github/workflows/android-helper-build.yml"
      - "VERSION"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: liquid-glass-ios26
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android app with updated helper
        working-directory: android
        run: ./gradlew --console=plain :app:assembleRelease
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Tether-Android-A07-helper-test
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

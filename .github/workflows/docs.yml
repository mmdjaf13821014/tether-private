# Publishes the documentation site to GitHub Pages on every push to main: the Markdown in docs/ (Jekyll),
# the Swift API reference (DocC) under /swift and the Kotlin API reference (Dokka) under /kotlin.
# Pages must be set to "GitHub Actions" as its source in the repository settings.
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Maven Central answers shared runners with 429 Too Many Requests at busy times; Google's mirror of it does not.
  TETHER_MAVEN_CENTRAL_MIRROR: https://maven-central.storage-download.googleapis.com/maven2/

jobs:
  # The Markdown site (GitHub's Jekyll action runs in a container, so on Linux) and the Kotlin reference.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Markdown site (Jekyll)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./site
      - name: Make the site writable
        run: sudo chown -R "$(id -u)" site
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Kotlin API reference (Dokka)
        working-directory: android
        run: |
          ./gradlew --console=plain -Ptether.libraryOnly=true :core:dokkaGenerate
          out=core/build/dokka/html
          if [ ! -d "$out" ]; then
            echo "::error::Dokka ran but $out does not exist."
            exit 1
          fi
          mkdir -p ../site/kotlin && cp -R "$out"/. ../site/kotlin/
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          retention-days: 1

  # The Swift reference needs DocC from Xcode's toolchain, so macOS.
  swift-reference:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Swift API reference (DocC)
        run: |
          swift package --allow-writing-to-directory swift-docs generate-documentation \
            --target TetherCore --output-path swift-docs \
            --transform-for-static-hosting --hosting-base-path tether/swift
          # DocC names files after operators ("!=(_:_:).json"); artifacts may not contain ":", so pass a tarball.
          tar -czf swift-reference.tgz -C swift-docs .
      - uses: actions/upload-artifact@v7
        with:
          name: swift-reference
          path: swift-reference.tgz
          retention-days: 1

  build:
    needs: [site, swift-reference]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: swift-reference
          path: .
      - name: Unpack the Swift reference
        run: mkdir -p site/swift && tar -xzf swift-reference.tgz -C site/swift
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

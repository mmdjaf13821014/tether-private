name: Inspect uploaded design ZIP
on:
  pull_request:
    branches: [main]
    paths:
      - tether-design-changes.zip
      - .github/workflows/inspect-zip.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and print source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/design
          unzip -o tether-design-changes.zip -d /tmp/design
          find /tmp/design -type f -print
          while IFS= read -r file; do
            echo "===== FILE: ${file#/tmp/design/} ====="
            cat "$file"
          done < <(find /tmp/design -type f | sort)

version: 2
updates:
  - package-ecosystem: gradle
    directories: ["/android", "/examples/kotlin-jvm"]
    schedule: {interval: weekly}
    labels: ["dependencies"]
    # The Android build tooling moves together and its major versions need a migration (plugin and DSL changes):
    # those are done by hand, not by a grouped bump.
    ignore:
      - dependency-name: "com.android.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directories: ["/", "/ios/TetherCore"]
    schedule: {interval: weekly}
    labels: ["dependencies"]
    groups:
      swift:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

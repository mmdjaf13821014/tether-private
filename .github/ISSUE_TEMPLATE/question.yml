name: Question / پرسش
description: Ask how to install, set up or use Tether. / دربارهٔ نصب، راه‌اندازی یا استفاده از تتر بپرسید.
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [FAQ](https://amirwmr.github.io/tether/FAQ.html) and the [install guide](https://amirwmr.github.io/tether/INSTALL.html) first.
        لطفاً اول [پرسش‌های رایج](https://amirwmr.github.io/tether/fa/faq.html) و [راهنمای فارسی](https://amirwmr.github.io/tether/fa/) را ببینید.
  - type: textarea
    id: question
    attributes:
      label: Your question / پرسش شما
      description: English or Persian. / فارسی یا انگلیسی.
    validations:
      required: true
  - type: input
    id: phones
    attributes:
      label: Phones and versions / گوشی‌ها و نسخه‌ها
      description: For example "Galaxy A54, Android 16 + iPhone 15, iOS 26; Tether 1.2.0". No phone numbers. / بدون شمارهٔ تلفن.
  - type: textarea
    id: report
    attributes:
      label: Problem report (optional) / گزارش مشکل (اختیاری)
      description: "If something does not work: attach the problem report (Tether › Help › Send a problem report on the Android phone, and Link › Send a problem report on the iPhone). / اگر چیزی کار نمی‌کند: گزارش مشکل را پیوست کنید (روی گوشی اندرویدی Tether › Help › Send a problem report و روی آیفون Link › Send a problem report)."

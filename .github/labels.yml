# Labels used by the issue templates, release.yml and dependabot.yml. Not applied automatically:
# create them once (for example with `gh label create`) or with a label-sync action.
- {name: bug, color: d73a4a, description: Something does not work}
- {name: enhancement, color: a2eeef, description: New feature or improvement}
- {name: breaking, color: b60205, description: Breaks installed apps, the protocol or an SDK API}
- {name: protocol, color: 5319e7, description: Wire format or message changes}
- {name: audio, color: fbca04, description: Call audio}
- {name: sdk-swift, color: f05138, description: Swift SDK (TetherCore)}
- {name: sdk-kotlin, color: 7f52ff, description: Kotlin SDK (core)}
- {name: android, color: 3ddc84, description: Android app, helper or client}
- {name: ios, color: "000000", description: iPhone / iPad app}
- {name: documentation, color: 0075ca, description: Docs}
- {name: dependencies, color: 0366d6, description: Dependency updates}
- {name: ci, color: ededed, description: CI and release workflows}
- {name: device-report, color: c5def5, description: Compatibility report from a device}
- {name: question, color: d876e3, description: A question about installing, setting up or using Tether}
- {name: needs-triage, color: fef2c0, description: Not looked at yet}
- {name: good first issue, color: 7057ff, description: Small and well described; good for a first contribution}
- {name: help wanted, color: 008672, description: Extra attention is needed}
- {name: skip-changelog, color: ffffff, description: Left out of the release notes}
- {name: translation, color: bfdadc, description: English / Persian strings}
